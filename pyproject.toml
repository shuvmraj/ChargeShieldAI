[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chargeshield-ai"
version = "1.0.0"
description = "Production-grade AI Risk Manager for Razorpay Pre-Settlement Fraud & Chargeback Defense"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "jinja2>=3.1.0",
    "joblib>=1.3.0",
    "faker>=24.0.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.33.0",
    "plotly>=5.20.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "shap>=0.45.0",
]
test = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools]
packages = [
    "chargeshield",
    "chargeshield.api",
    "chargeshield.data",
    "chargeshield.dispute",
    "chargeshield.explainability",
    "chargeshield.features",
    "chargeshield.models"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
